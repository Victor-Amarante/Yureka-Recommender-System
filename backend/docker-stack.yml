version: "3.8"

services:
  backend:
    image: $DOCKERHUB_USERNAME/yureka-be:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_SECRET_ID=${GOOGLE_SECRET_ID}
    networks:
      - yureka-net
    volumes:
      - static_data:/app/staticfiles

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - yureka-net

networks:
  yureka-net:
    driver: overlay

volumes:
  static_data:
